<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一問一答ポータル - 戦国合戦Ver.</title>
  <style>
    :root {
      --primary: #8b0000; /* 漆黒・深紅 */
      --success: #28a745;
      --danger: #dc3545;
      --bg: #120c0a;
      --card-bg: rgba(25, 20, 20, 0.88);
    }

    body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", -apple-system, BlinkMacSystemFont, serif;
      background-color: var(--bg);
      /* ⚔️ 戦国荒野風の背景（赤黒い雲・荒涼とした大地イメージ） */
      background:
        radial-gradient(circle at 50% 30%, rgba(139, 0, 0, 0.3) 0%, transparent 70%),
        linear-gradient(to bottom, #1a0f0d 0%, #0d0806 60%, #050302 100%);
      color: #eaeaea;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* 🎯 全体を下寄りに配置 */
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
      position: relative;
    }

    /* 教科選択画面は敵の立ち絵がないため、カードを画面中央に置く */
    body.home-layout {
      justify-content: center;
    }

    body.home-layout .app-container {
      margin-bottom: 0;
    }

    /* 戦国の荒野：火の粉や霞の演出用オーバーレイ */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 50% 100%, rgba(255, 68, 0, 0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 2;
    }

    /* 🎯 アプリメイン容器（画面中央～下部に配置） */
    .app-container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border: 1px solid #5a3825;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(139, 0, 0, 0.3);
      position: relative;
      z-index: 10;
      backdrop-filter: blur(10px);
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    h1, h2 {
      text-align: center;
      margin-top: 0;
      color: #f3a852;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.2rem; }

    button, input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #664433;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
      background: #2a1f1b;
      color: #fff;
    }

    button {
      background: linear-gradient(180deg, #8b1a1a 0%, #5c0e0e 100%);
      color: #ffe6d0;
      border: 1px solid #a33232;
      font-weight: bold;
      cursor: pointer;
      text-shadow: 0 1px 2px #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    button:active { opacity: 0.9; transform: translateY(1px); }
    button:disabled {
      background: #443833 !important;
      border-color: #554842 !important;
      color: #887770 !important;
      cursor: not-allowed;
    }

    /* 教科選択グリッド */
    .subject-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .subject-btn {
      padding: 20px 10px;
      font-size: 1.1rem;
      background: linear-gradient(180deg, #3a2a24 0%, #241915 100%);
      color: #f0e0d0;
      border: 1px solid #775544;
      margin-bottom: 0;
    }

    /* 分野・カテゴリチェックボックス */
    .category-group {
      background: rgba(0, 0, 0, 0.4);
      padding: 15px;
      border: 1px solid #443028;
      border-radius: 8px;
      margin-bottom: 15px;
      max-height: 200px;
      overflow-y: auto;
    }

    .category-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      font-size: 1rem;
      cursor: pointer;
      color: #ddd;
    }

    .category-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 10px;
      cursor: pointer;
    }

    .select-tools {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .select-tools button {
      padding: 6px 12px;
      font-size: 0.85rem;
      background: #4a3b35;
      border-color: #665248;
      margin-bottom: 0;
    }

    .stats {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #44332a;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-around;
      text-align: center;
      color: #cca;
    }

    /* -----------------------------------
       👹 画面上部中央：敵キャラ立ち絵エリア
    ----------------------------------- */
    .enemy-stage {
      position: fixed;
      top: 50px; /* HPゲージの直下に配置 */
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }

    /* 小さめに配置された敵立ち絵 */
    .enemy-sprite {
      max-width: 180px;  /* 🎯 小さめのサイズ感 */
      max-height: 180px;
      object-fit: contain;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.9)) drop-shadow(0 0 10px rgba(255, 0, 0, 0.3));
      transition: transform 0.2s, filter 0.3s;
      /* 待機中は上下させ、生きているように見せる（数値を小さくするほど速くなる） */
      animation: enemy-idle 2.2s ease-in-out infinite;
      transform-origin: center bottom;
    }

    /* 呼吸するような上下動。浮くほど影が離れて柔らかくなる */
    @keyframes enemy-idle {
      0%, 100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 10px 15px rgba(0,0,0,0.9)) drop-shadow(0 0 10px rgba(255, 0, 0, 0.3));
      }
      50% {
        transform: translateY(-7px) scale(1.015);
        filter: drop-shadow(0 18px 20px rgba(0,0,0,0.7)) drop-shadow(0 0 20px rgba(255, 0, 0, 0.5));
      }
    }

    /* 動きが苦手な人のために、設定でオフにできるようにする */
    @media (prefers-reduced-motion: reduce) {
      .enemy-sprite { animation: none; }
    }

    /* ダメージ時の立ち絵演出 */
    .enemy-sprite.shake {
      animation: enemy-hit 0.4s ease-in-out;
    }

    @keyframes enemy-hit {
      0% { transform: scale(1); filter: brightness(1); }
      20% { transform: scale(1.15) rotate(-5deg); filter: brightness(3) drop-shadow(0 0 30px #ff0055); }
      40% { transform: scale(0.9) rotate(5deg); filter: brightness(2) drop-shadow(0 0 20px #00ffff); }
      60% { transform: scale(1.05); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .enemy-sprite.defeated {
      animation: enemy-defeated 1.2s forwards;
    }

    @keyframes enemy-defeated {
      0% { transform: scale(1); opacity: 1; filter: brightness(5) drop-shadow(0 0 50px white); }
      50% { transform: scale(1.2) translateY(-20px); opacity: 0.8; filter: brightness(10) drop-shadow(0 0 80px red); }
      100% { transform: scale(0) translateY(50px); opacity: 0; }
    }

    /* -----------------------------------
       🩸 画面上部固定 UI（HPバー）
    ----------------------------------- */
    .fixed-battle-ui {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 500px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .hp-container {
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #8b0000;
      border-radius: 10px;
      height: 22px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(139, 0, 0, 0.8);
    }

    .hp-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(to right, #e63946, #ff758c);
      transition: width 0.4s ease-out;
    }

    .combo-badge {
      margin-top: 4px;
      background: linear-gradient(45deg, #ff0055, #ffaa00);
      color: #fff;
      font-weight: 900;
      font-size: 0.95rem;
      padding: 2px 12px;
      border-radius: 12px;
      box-shadow: 0 0 12px #ff0055;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.3s;
    }

    .combo-badge.show {
      opacity: 1;
      transform: scale(1);
    }

    /* 💥 全画面エフェクト層 */
    .full-fx-layer {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 15;
      overflow: hidden;
    }

    /* 衝撃波・斬撃（敵の立ち絵の位置：top: 140px 周辺に発生） */
    .impact-effect {
      position: absolute;
      top: 140px;
      left: 50%;
      width: 10px; height: 10px;
      background: radial-gradient(circle, #ffffff 10%, #ff4500 40%, rgba(255,0,0,0) 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }

    .impact-effect.active { animation: impact-ring 0.45s ease-out; }

    @keyframes impact-ring {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(60); opacity: 0; }
    }

    .slash-effect {
      position: absolute;
      top: 140px;
      left: 50%;
      width: 0; height: 12px;
      background: #ffffff;
      box-shadow: 0 0 30px #ff3300, 0 0 60px #ffaa00;
      transform: translate(-50%, -50%) rotate(-35deg);
      opacity: 0;
      border-radius: 6px;
    }

    .slash-effect.active { animation: slash-anim 0.35s cubic-bezier(0.1, 0.8, 0.3, 1); }

    @keyframes slash-anim {
      0% { width: 0; opacity: 1; transform: translate(-50%, -50%) rotate(-35deg) scaleY(1); }
      50% { width: 120vw; opacity: 1; transform: translate(-50%, -50%) rotate(-35deg) scaleY(3); }
      100% { width: 140vw; opacity: 0; transform: translate(-50%, -50%) rotate(-35deg) scaleY(0.1); }
    }

    /* ダメージ数値 */
    .damage-num {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      /* 画面幅に収まるよう文字を伸縮させ、長いラベルは折り返す */
      width: 92vw;
      max-width: 480px;
      text-align: center;
      font-size: clamp(1.6rem, 6.5vw, 3rem);
      line-height: 1.2;
      font-weight: 900;
      color: #ffea00;
      text-shadow: 0 0 15px #ffea00, 3px 3px 0 #000;
      opacity: 0;
      font-style: italic;
    }

    .damage-num.active { animation: pop-damage 0.85s ease-out; }

    @keyframes pop-damage {
      0% { transform: translate(-50%, 20px) scale(0.3); opacity: 1; }
      40% { transform: translate(-50%, -15px) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -40px) scale(1); opacity: 0; }
    }

    /* ----------------------------------- */

    .question-card {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #553a2e;
      padding: 15px;
      border-radius: 8px;
      min-height: 65px;
      font-size: 1.05rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      line-height: 1.5;
    }

    .feedback {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
      display: none;
      position: relative;
      overflow: hidden;
    }

    .feedback.correct {
      background-color: rgba(40, 167, 69, 0.2);
      border: 1px solid var(--success);
      color: #72e08a;
      display: block;
    }

    .feedback.incorrect {
      background-color: rgba(220, 53, 69, 0.2);
      border: 1px solid var(--danger);
      color: #ff8e98;
      display: block;
    }

    /* 📜 解説（正解・不正解にかかわらず必ず表示する） */
    .explanation {
      margin-top: 12px;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(62, 46, 31, 0.55) 0%, rgba(28, 21, 16, 0.6) 100%);
      border: 1px solid #6b5236;
      border-left: 4px solid #f3a852;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.85;
      color: #f2e8da;
      text-align: left;
      max-height: 45vh;
      overflow-y: auto;
    }

    .explanation-title {
      display: block;
      color: #f3a852;
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      margin-bottom: 6px;
    }

    /* 🏆 ご褒美：正解を重ねるほど解像度が上がる絵巻 */
    .reward-panel {
      margin-top: 18px;
      padding: 14px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid #6b5236;
      border-radius: 10px;
      text-align: center;
    }

    .reward-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.85rem;
      color: #f3a852;
      margin-bottom: 10px;
    }

    .reward-level {
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    .reward-frame {
      display: inline-block;
      padding: 6px;
      background: linear-gradient(145deg, #6b5236, #2a1f18);
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7);
      cursor: pointer;
      line-height: 0;
    }

    .reward-canvas {
      width: 190px;
      height: 285px;
      display: block;
      background: #100b09;
      border-radius: 3px;
    }

    .reward-bar {
      margin: 12px 0 6px;
      height: 8px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #55402c;
      border-radius: 5px;
      overflow: hidden;
    }

    .reward-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #b9832f, #ffd479);
      transition: width 0.6s ease-out;
    }

    .reward-caption {
      font-size: 0.82rem;
      color: #ccb89a;
      line-height: 1.6;
    }

    /* 拡大表示のオーバーレイ */
    .reward-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(5, 3, 2, 0.94);
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 20px;
      box-sizing: border-box;
      cursor: pointer;
    }

    .reward-overlay canvas {
      max-width: 100%;
      max-height: 78vh;
      border-radius: 6px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
    }

    .reward-overlay p {
      margin: 0;
      color: #ccb89a;
      font-size: 0.85rem;
      text-align: center;
    }

    /* ✅ 解答後に出す「要復習」のチェック */
    .mark-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(80, 60, 30, 0.35);
      border: 1px solid #6b5236;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      color: #f0e0c8;
      user-select: none;
    }

    .mark-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 📋 復習リスト */
    .review-summary {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #44332a;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: #ccb89a;
      text-align: center;
      line-height: 1.7;
    }

    .review-list {
      max-height: 46vh;
      overflow-y: auto;
      margin-bottom: 14px;
      border: 1px solid #443028;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px;
    }

    .review-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid #38281f;
    }

    .review-item:last-child { border-bottom: none; }

    .review-badges {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .review-badge {
      display: inline-block;
      width: 26px;
      height: 26px;
      line-height: 26px;
      text-align: center;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    /* 違＝間違えた問題、復＝自分で印をつけた問題 */
    .badge-wrong { background: rgba(220, 53, 69, 0.35); border: 1px solid var(--danger); color: #ff9ba3; }
    .badge-marked { background: rgba(243, 168, 82, 0.25); border: 1px solid #f3a852; color: #ffcf90; }

    .review-body { flex: 1; min-width: 0; }

    .review-q {
      font-size: 0.92rem;
      line-height: 1.6;
      color: #eee;
      margin-bottom: 4px;
    }

    .review-a { font-size: 0.86rem; color: #8fd9a0; }
    .review-cat { font-size: 0.78rem; color: #9a8a76; }

    .review-remove {
      width: auto;
      flex-shrink: 0;
      padding: 5px 10px;
      font-size: 0.78rem;
      background: #4a3b35;
      border-color: #665248;
      margin-bottom: 0;
      align-self: center;
    }

    .review-empty {
      padding: 30px 10px;
      text-align: center;
      color: #9a8a76;
      font-size: 0.9rem;
      line-height: 1.8;
    }

    /* 🩸 縦のHPバー（パソコン表示でのみ使う） */
    .vertical-battle-ui {
      position: fixed;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 20;
      pointer-events: none;
    }

    .vhp-container {
      flex: 1;
      width: 28px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #8b0000;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(139, 0, 0, 0.8);
      position: relative;
    }

    /* 上端で固定してあるので、高さが減ると下から削れて敵の方へ迫っていく */
    .vhp-fill {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 100%;
      background: linear-gradient(to bottom, #ff758c, #e63946);
      transition: height 0.45s ease-out;
    }

    .vhp-value {
      text-align: center;
      line-height: 1.2;
    }

    .vhp-value span {
      display: block;
      font-size: 1.5rem;
      font-weight: bold;
      color: #ff9ba3;
      text-shadow: 0 0 10px rgba(230, 57, 70, 0.9), 0 2px 3px #000;
    }

    .vhp-value small {
      font-size: 0.7rem;
      color: #b09088;
      letter-spacing: 0.1em;
    }

    .hidden { display: none !important; }

    /* =========================================================
       🖥 パソコン向け。空いている左右を使い、縦スクロールを減らす
       ========================================================= */
    @media (min-width: 900px) {
      body {
        justify-content: center;
        padding: 24px 3vw;
      }

      /* 戦闘中は左半分に敵、右半分にカードを置く */
      .app-container {
        max-width: 720px;
        margin-bottom: 0;
        margin-left: auto;
        margin-right: auto;
        padding: 26px 30px;
      }

      /* 戦闘中は右側に敵とHPバーの列を置くので、その分の幅を空ける */
      body.quiz-layout { padding-right: 250px; }

      /* 敵は右上に小さく */
      .enemy-stage {
        left: auto;
        right: 3vw;
        top: 30px;
        transform: none;
        width: 190px;
        max-width: 190px;
        height: 170px;
      }

      .enemy-sprite {
        max-width: 150px;
        max-height: 150px;
      }

      /* 横のHPバーは使わず、連撃バッジだけを敵の下に出す */
      .fixed-battle-ui {
        left: auto;
        right: 3vw;
        top: 205px;
        width: 190px;
        max-width: 190px;
      }

      .fixed-battle-ui .hp-container { display: none; }

      /* 敵の下から画面下まで、縦のHPバーをのばす */
      .vertical-battle-ui {
        display: flex;
        right: 3vw;
        top: 245px;
        bottom: 34px;
        width: 190px;
      }

      /* ダメージ数値は敵のそばに出す */
      .damage-num {
        left: auto;
        right: 3vw;
        width: 190px;
        max-width: 190px;
        top: 165px;
        font-size: 1.45rem;
      }

      .damage-num.active { animation: pop-damage-pc 0.85s ease-out; }

      @keyframes pop-damage-pc {
        0%   { transform: translateY(16px) scale(0.3); opacity: 1; }
        40%  { transform: translateY(-12px) scale(1.15); opacity: 1; }
        100% { transform: translateY(-34px) scale(1); opacity: 0; }
      }

      /* 問題と入力欄を大きくして読みやすくする */
      h1 { font-size: 1.7rem; }
      h2 { font-size: 1.4rem; }
      .question-card { font-size: 1.35rem; padding: 24px; min-height: 100px; line-height: 1.7; }
      #answer-input { font-size: 1.25rem; padding: 16px; }
      .explanation { font-size: 1rem; max-height: none; }
      .stats { font-size: 0.95rem; padding: 10px 14px; }

      /* 教科選択は3列に広げる */
      .subject-grid { grid-template-columns: repeat(3, 1fr); }

      /* 分野選択は左、絵巻は右に並べる */
      #setup-screen {
        display: grid;
        grid-template-columns: 1fr 260px;
        gap: 26px;
        align-items: start;
      }

      #setup-screen > h2 { grid-column: 1 / -1; }
      .setup-main { grid-column: 1; }
      #setup-screen .reward-panel { grid-column: 2; margin-top: 0; }

      /* 縦に余裕があるので、分野は多めに見せてスクロールを減らす */
      .category-group { max-height: 340px; }
      .reward-canvas { width: 216px; height: 324px; }

      /* 復習リストも広く使う */
      .review-list { max-height: 54vh; }
      .review-q { font-size: 1rem; }
    }

    /* さらに広い画面では、復習リストを2列に並べて一覧性を上げる */
    @media (min-width: 1280px) {
      .app-container { max-width: 820px; }
      #review-screen .review-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 14px;
        max-height: 58vh;
      }
    }
  </style>
</head>

<script>
  // この正答率で敵のHPがちょうど0になるようにダメージ量を配分する
  const DEFEAT_ACCURACY = 0.9;
  // 解答時間の判定（秒）
  const CRITICAL_SEC = 3.0;  // これ以内なら会心の一撃
  const COMBO_SEC = 5.0;     // これを超えると連撃が途切れ、ダメージが減る

  // 🏆 ご褒美の絵巻：教科ごとの累計正解数に応じて解像度が上がる
  const REWARD_TITLES = {
    history: '絵巻 ─ 戦国の智将',
    math: '絵巻 ─ 兵法の軍師',
    science: '絵巻 ─ 万象の錬成師',
    geography: '絵巻 ─ 旅路の踏破者',
    english: '絵巻 ─ 大海の冒険者',
  };

  // need: 到達に必要な累計正解数 / blocks: 横方向の分割数（大きいほど鮮明、null で原寸表示）
  const REWARD_STEPS = [
    { need: 0,   blocks: 6 },
    { need: 10,  blocks: 12 },
    { need: 25,  blocks: 20 },
    { need: 50,  blocks: 36 },
    { need: 85,  blocks: 64 },
    { need: 125, blocks: 120 },
    { need: 170, blocks: null },
  ];
  const REWARD_MAX_LEVEL = REWARD_STEPS.length - 1;

  let rewardImage = null;
  let correctTotal = 0;
  let sessionStartLevel = 0;

  // ----- ⚔️ 抜刀の効果音（sounds/slash.mp3 を再生する） -----

  const SLASH_FILE = 'sounds/slash.mp3';

  let audioCtx = null;
  let slashBuffer = null;      // 読みこみ済みの音声データ
  let slashFailed = false;     // 読みこみに失敗したか
  let soundEnabled = localStorage.getItem('soundEnabled') !== 'off';

  function getAudioContext() {
    if (audioCtx) return audioCtx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
    return audioCtx;
  }

  // 音声ファイルは一度だけ読みこんで展開しておく。
  // 毎回ファイルを読むと、正解した瞬間に音が遅れて出てしまう
  function loadSlashSound() {
    const ctx = getAudioContext();
    if (!ctx || slashBuffer || slashFailed) return;

    fetch(SLASH_FILE)
      .then(res => {
        if (!res.ok) throw new Error(res.status);
        return res.arrayBuffer();
      })
      .then(data => ctx.decodeAudioData(data))
      .then(decoded => {
        slashBuffer = decoded;
        updateSoundBtn();
      })
      .catch(() => {
        slashFailed = true;
        updateSoundBtn();
      });
  }

  // power: ダメージ倍率。会心や連撃ほど、わずかに速く鋭い音になる
  function playSlashSound(power) {
    if (!soundEnabled || !slashBuffer) return;

    const ctx = getAudioContext();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();

    const source = ctx.createBufferSource();
    source.buffer = slashBuffer;
    source.playbackRate.value = 0.94 + Math.min(power, 1.5) * 0.08;

    // 元ファイルの最大振幅が0.6のため、他の演出と音量がそろうよう持ち上げる
    const gain = ctx.createGain();
    gain.gain.value = 1.45;

    // 毎回新しく作るので、連続で正解しても音が途切れず重なって鳴る
    source.connect(gain).connect(ctx.destination);
    source.start();
  }

  function updateSoundBtn() {
    const btn = document.getElementById('sound-btn');
    if (slashFailed) {
      btn.textContent = '⚠️ 効果音: 読みこめません';
      return;
    }
    btn.textContent = soundEnabled ? '🔊 効果音: オン' : '🔇 効果音: オフ';
  }

  document.getElementById('sound-btn').addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    localStorage.setItem('soundEnabled', soundEnabled ? 'on' : 'off');
    updateSoundBtn();
    if (soundEnabled) playSlashSound(1.2);  // 切りかえたその場で音を確認できる
  });

  updateSoundBtn();  // 前回オフにしていた場合に備えて表示を合わせる

  let currentSubjectKey = '';
  let currentSubjectName = '';
  let allQuestions = [];
  let currentSessionQuestions = [];
  let currentQuestionIndex = 0;
  let correctCount = 0;
  let answeredCount = 0;
  let wrongQuestions = [];    // 間違えた問題（自動で記録）
  let markedQuestions = [];   // 要復習として自分で印をつけた問題
  let reviewFilter = 'all';   // 復習リストの絞りこみ: all / wrong / marked

  let questionStartTime = 0;
  let sessionStartTime = 0;
  let enemyHp = 100;
  let baseDamagePerQuestion = 0;
  let comboCount = 0;
  let maxComboCount = 0;

  function selectSubject(key, name, labelText) {
    currentSubjectKey = key;
    currentSubjectName = name;

    document.getElementById('subject-title').textContent = `${name} 一問一答`;
    document.getElementById('category-label').textContent = `出題する${labelText}を選択:`;

    wrongQuestions = JSON.parse(localStorage.getItem(`wrongQuestions_${key}`) || '[]');
    markedQuestions = JSON.parse(localStorage.getItem(`markedQuestions_${key}`) || '[]');
    correctTotal = parseInt(localStorage.getItem(`correctTotal_${key}`), 10) || 0;
    loadRewardImage(key);
    loadSlashSound();  // 出題前に読みこんでおき、正解した瞬間に遅れなく鳴らす

    fetch(`${key}.json`)
      .then(response => {
        if (!response.ok) throw new Error();
        return response.json();
      })
      .then(data => {
        allQuestions = data;
        initSetupScreen();
        document.body.classList.remove('home-layout');
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
      })
      .catch(err => alert(`${name}のデータ (${key}.json) の読み込みに失敗しました。`));
  }

  function initSetupScreen() {
    const categories = [...new Set(allQuestions.map(q => q.category))];
    const container = document.getElementById('category-checkboxes');
    container.innerHTML = '';

    categories.forEach(cat => {
      const label = document.createElement('label');
      label.className = 'category-item';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = cat;
      checkbox.checked = true;
      checkbox.addEventListener('change', updateReviewBtn);

      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(cat));
      container.appendChild(label);
    });

    updateReviewBtn();
    updateRewardPanel();
  }

  // ----- 🏆 ご褒美の絵巻 -----

  function loadRewardImage(key) {
    rewardImage = null;
    const img = new Image();
    img.onload = () => { rewardImage = img; updateRewardPanel(); };
    img.onerror = () => { rewardImage = null; updateRewardPanel(); };
    img.src = `rewards/${key}.jpg`;
  }

  function rewardLevel(total) {
    let level = 0;
    REWARD_STEPS.forEach((step, i) => {
      if (total >= step.need) level = i;
    });
    return level;
  }

  function drawReward(canvas, level) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;

    ctx.clearRect(0, 0, w, h);
    if (!rewardImage) {
      ctx.fillStyle = '#2a1f18';
      ctx.fillRect(0, 0, w, h);
      return;
    }

    const blocks = REWARD_STEPS[level].blocks;
    if (blocks === null) {
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(rewardImage, 0, 0, w, h);
      return;
    }

    // いったん極小サイズに描いてから引き伸ばすことでモザイクをつくる
    const small = document.createElement('canvas');
    small.width = blocks;
    small.height = Math.max(1, Math.round(blocks * h / w));

    const sctx = small.getContext('2d');
    sctx.imageSmoothingEnabled = true;
    sctx.drawImage(rewardImage, 0, 0, small.width, small.height);

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, w, h);
  }

  function updateRewardPanel() {
    const level = rewardLevel(correctTotal);

    document.getElementById('reward-title').textContent = REWARD_TITLES[currentSubjectKey] || '絵巻';
    document.getElementById('reward-level').textContent = `Lv.${level} / ${REWARD_MAX_LEVEL}`;
    drawReward(document.getElementById('reward-canvas'), level);

    const fill = document.getElementById('reward-bar-fill');
    const caption = document.getElementById('reward-caption');

    if (level >= REWARD_MAX_LEVEL) {
      fill.style.width = '100%';
      caption.textContent = `累計${correctTotal}問正解。絵巻は完全に開かれた！（タップで拡大）`;
    } else {
      const from = REWARD_STEPS[level].need;
      const to = REWARD_STEPS[level + 1].need;
      fill.style.width = `${Math.round((correctTotal - from) / (to - from) * 100)}%`;
      caption.textContent =
        `累計${correctTotal}問正解 ／ あと${to - correctTotal}問の正解でLv.${level + 1}、絵巻がより鮮明になる`;
    }
  }

  document.getElementById('reward-frame').addEventListener('click', () => {
    if (!rewardImage) return;
    const level = rewardLevel(correctTotal);
    drawReward(document.getElementById('reward-overlay-canvas'), level);
    document.getElementById('reward-overlay-caption').textContent =
      `${REWARD_TITLES[currentSubjectKey]}　Lv.${level} / ${REWARD_MAX_LEVEL}（画面をタップで閉じる）`;
    document.getElementById('reward-overlay').classList.remove('hidden');
  });

  document.getElementById('reward-overlay').addEventListener('click', () => {
    document.getElementById('reward-overlay').classList.add('hidden');
  });

  function getSelectedCategories() {
    const checkboxes = document.querySelectorAll('#category-checkboxes input[type="checkbox"]:checked');
    return Array.from(checkboxes).map(cb => cb.value);
  }

  document.getElementById('select-all-btn').addEventListener('click', () => {
    document.querySelectorAll('#category-checkboxes input[type="checkbox"]').forEach(cb => cb.checked = true);
    updateReviewBtn();
  });

  document.getElementById('deselect-all-btn').addEventListener('click', () => {
    document.querySelectorAll('#category-checkboxes input[type="checkbox"]').forEach(cb => cb.checked = false);
    updateReviewBtn();
  });

  // ----- 📋 復習リスト（間違えた問題と、印をつけた問題をまとめて扱う） -----

  const isWrong = id => wrongQuestions.some(q => q.id === id);
  const isMarked = id => markedQuestions.some(q => q.id === id);

  function saveReviewState() {
    localStorage.setItem(`wrongQuestions_${currentSubjectKey}`, JSON.stringify(wrongQuestions));
    localStorage.setItem(`markedQuestions_${currentSubjectKey}`, JSON.stringify(markedQuestions));
  }

  // 両方を1つにまとめる。どちらにも入っている問題は1件として扱う
  function buildReviewList() {
    const cats = getSelectedCategories();
    const merged = new Map();
    wrongQuestions.concat(markedQuestions).forEach(q => {
      if (cats.includes(q.category)) merged.set(q.id, q);
    });
    return [...merged.values()];
  }

  function filteredReviewList() {
    return buildReviewList().filter(q => {
      if (reviewFilter === 'wrong') return isWrong(q.id);
      if (reviewFilter === 'marked') return isMarked(q.id);
      return true;
    });
  }

  function updateReviewBtn() {
    const selectedCats = getSelectedCategories();
    const btn = document.getElementById('review-btn');
    const total = buildReviewList().length;

    btn.textContent = `復習リスト (${total}件)`;
    btn.disabled = total === 0;
    document.getElementById('start-btn').disabled = selectedCats.length === 0;
  }

  function renderReviewScreen() {
    const list = filteredReviewList();
    const all = buildReviewList();
    const wrongCount = all.filter(q => isWrong(q.id)).length;
    const markedCount = all.filter(q => isMarked(q.id)).length;

    document.getElementById('review-summary').textContent =
      `全${all.length}件　（違 まちがえた ${wrongCount}件 ／ 復 要復習 ${markedCount}件）`;

    const box = document.getElementById('review-list');
    box.textContent = '';

    if (list.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'review-empty';
      empty.textContent = all.length === 0
        ? '復習する問題はまだありません。\n間違えた問題は自動で、気になった問題はチェックを入れると、ここに集まります。'
        : 'この絞りこみに当てはまる問題はありません。';
      box.appendChild(empty);
    }

    list.forEach(q => {
      const item = document.createElement('div');
      item.className = 'review-item';

      const badges = document.createElement('div');
      badges.className = 'review-badges';
      if (isWrong(q.id)) {
        const b = document.createElement('span');
        b.className = 'review-badge badge-wrong';
        b.textContent = '違';
        b.title = 'まちがえた問題';
        badges.appendChild(b);
      }
      if (isMarked(q.id)) {
        const b = document.createElement('span');
        b.className = 'review-badge badge-marked';
        b.textContent = '復';
        b.title = '自分で要復習にした問題';
        badges.appendChild(b);
      }

      const body = document.createElement('div');
      body.className = 'review-body';
      const cat = document.createElement('div');
      cat.className = 'review-cat';
      cat.textContent = q.category;
      const text = document.createElement('div');
      text.className = 'review-q';
      text.textContent = q.question;
      const ans = document.createElement('div');
      ans.className = 'review-a';
      ans.textContent = `答え: ${q.answer}`;
      body.append(cat, text, ans);

      const remove = document.createElement('button');
      remove.className = 'review-remove';
      remove.textContent = '解除';
      remove.addEventListener('click', () => {
        wrongQuestions = wrongQuestions.filter(x => x.id !== q.id);
        markedQuestions = markedQuestions.filter(x => x.id !== q.id);
        saveReviewState();
        renderReviewScreen();
        updateReviewBtn();
      });

      item.append(badges, body, remove);
      box.appendChild(item);
    });

    const startBtn = document.getElementById('review-start-btn');
    startBtn.textContent = `この一覧で出陣（${list.length}問）`;
    startBtn.disabled = list.length === 0;
  }

  function goReview() {
    reviewFilter = 'all';
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('review-screen').classList.remove('hidden');
    renderReviewScreen();
  }

  document.getElementById('review-btn').addEventListener('click', goReview);
  document.getElementById('review-back-btn').addEventListener('click', goSetup);
  document.getElementById('review-start-btn').addEventListener('click', () => startQuiz(filteredReviewList()));

  [['review-filter-all', 'all'], ['review-filter-wrong', 'wrong'], ['review-filter-marked', 'marked']]
    .forEach(([id, mode]) => {
      document.getElementById(id).addEventListener('click', () => {
        reviewFilter = mode;
        renderReviewScreen();
      });
    });

  document.getElementById('start-btn').addEventListener('click', () => startQuiz(null));

  // questions に配列を渡すと復習戦、null なら通常戦
  function startQuiz(questions) {
    const selectedCats = getSelectedCategories();

    if (questions) {
      currentSessionQuestions = questions.slice();
      document.getElementById('current-mode').textContent = "復習戦";
    } else {
      currentSessionQuestions = allQuestions.filter(q => selectedCats.includes(q.category));
      document.getElementById('current-mode').textContent = "通常戦";
    }

    document.getElementById('review-screen').classList.add('hidden');
    currentSessionQuestions.sort(() => Math.random() - 0.5);

    currentQuestionIndex = 0;
    correctCount = 0;
    answeredCount = 0;
    comboCount = 0;
    maxComboCount = 0;
    enemyHp = 100;
    sessionStartLevel = rewardLevel(correctTotal);

    sessionStartTime = Date.now();

    const totalQ = currentSessionQuestions.length;
    baseDamagePerQuestion = totalQ > 0 ? (100 / (totalQ * DEFEAT_ACCURACY)) : 100;

    updateHpBar();
    updateComboBadge();

    // 敵立ち絵・UIを表示
    document.getElementById('enemy-stage').classList.remove('hidden');
    document.getElementById('full-fx-layer').classList.remove('hidden');
    document.getElementById('fixed-battle-ui').classList.remove('hidden');
    document.getElementById('vertical-battle-ui').classList.remove('hidden');

    document.body.classList.add('quiz-layout');
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    showQuestion();
  }

  function showQuestion() {
    const enemySprite = document.getElementById('enemy-sprite');
    enemySprite.className = 'enemy-sprite';

    const q = currentSessionQuestions[currentQuestionIndex];
    document.getElementById('question-text').textContent = `【${q.category}】 ${q.question}`;
    const input = document.getElementById('answer-input');
    input.value = '';
    input.disabled = false;
    input.focus();  // 続けてキーボードだけで解答できるようにする
    document.getElementById('submit-btn').classList.remove('hidden');
    document.getElementById('next-btn').classList.add('hidden');

    const feedback = document.getElementById('feedback');
    feedback.className = 'feedback';
    feedback.textContent = '';
    document.getElementById('explanation').classList.add('hidden');
    document.getElementById('mark-row').classList.add('hidden');

    updateStats();
    questionStartTime = Date.now();
  }

  function updateStats() {
    const accuracy = answeredCount === 0 ? 0 : Math.round((correctCount / answeredCount) * 100);
    document.getElementById('accuracy').textContent = `${accuracy}%`;
    document.getElementById('progress').textContent = `${currentQuestionIndex + 1}/${currentSessionQuestions.length}`;
  }

  function updateHpBar() {
    const hp = Math.max(0, enemyHp);
    document.getElementById('hp-bar').style.width = `${hp}%`;        // スマホ向けの横バー
    document.getElementById('vhp-fill').style.height = `${hp}%`;     // パソコン向けの縦バー
    document.getElementById('vhp-number').textContent = Math.ceil(hp);
  }

  function updateComboBadge() {
    const badge = document.getElementById('combo-badge');
    if (comboCount >= 2) {
      badge.textContent = `${comboCount} 連撃!🔥`;
      badge.classList.add('show');
    } else {
      badge.classList.remove('show');
    }
  }

  function triggerAttackEffect(timeSec) {
    const enemySprite = document.getElementById('enemy-sprite');
    const impact = document.getElementById('impact');
    const slash = document.getElementById('slash');
    const damage = document.getElementById('damage');

    let multiplier = 1.0;
    let label = '';

    if (timeSec <= COMBO_SEC) {
      comboCount++;
      if (comboCount > maxComboCount) maxComboCount = comboCount;

      if (comboCount >= 3) {
        multiplier = 1.5;
        label = `🔥 ${comboCount}連撃! `;
      } else if (timeSec <= CRITICAL_SEC) {
        multiplier = 1.2;
        label = '⚡ 会心の一撃! ';
      } else {
        multiplier = 1.0;
        label = '見事! ';
      }
    } else {
      comboCount = 0;
      multiplier = 0.7;
      label = '浅い! ';
    }

    updateComboBadge();
    playSlashSound(multiplier);

    const damagePercent = baseDamagePerQuestion * multiplier;
    enemyHp -= damagePercent;
    if (enemyHp < 0) enemyHp = 0;

    updateHpBar();

    const displayDamage = Math.round(damagePercent * 100);
    damage.textContent = `${label}${displayDamage}`;

    enemySprite.classList.remove('shake', 'defeated');
    impact.classList.remove('active');
    slash.classList.remove('active');
    damage.classList.remove('active');

    setTimeout(() => {
      impact.classList.add('active');
      slash.classList.add('active');
      damage.classList.add('active');

      if (enemyHp <= 0) {
        enemySprite.classList.add('defeated');
      } else {
        enemySprite.classList.add('shake');
      }
    }, 10);
  }

  // 被弾アニメが終わったらクラスを外し、待機の上下動を再開させる
  document.getElementById('enemy-sprite').addEventListener('animationend', (e) => {
    if (e.animationName === 'enemy-hit') {
      e.target.classList.remove('shake');
    }
  });

  // 解答判定
  document.getElementById('answer-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('answer-input').value.trim();
    const q = currentSessionQuestions[currentQuestionIndex];
    const feedback = document.getElementById('feedback');

    const answerTimeSec = (Date.now() - questionStartTime) / 1000;
    answeredCount++;

    document.getElementById('answer-input').disabled = true;
    document.getElementById('submit-btn').classList.add('hidden');

    const cleanInput = input.toLowerCase().replaceAll(' ', '');
    const cleanAnswer = q.answer.toLowerCase().replaceAll(' ', '');

    if (cleanInput === cleanAnswer) {
      triggerAttackEffect(answerTimeSec);

      correctCount++;
      correctTotal++;
      localStorage.setItem(`correctTotal_${currentSubjectKey}`, String(correctTotal));

      feedback.className = "feedback correct";
      feedback.textContent = `正解！⭕ (${answerTimeSec.toFixed(1)}秒)`;
      wrongQuestions = wrongQuestions.filter(item => item.id !== q.id);

    } else {
      comboCount = 0;
      updateComboBadge();

      feedback.className = "feedback incorrect";
      feedback.textContent = `無念…❌ (正答: ${q.answer})`;
      if (!wrongQuestions.some(item => item.id === q.id)) {
        wrongQuestions.push(q);
      }
    }

    // 正解・不正解にかかわらず解説を読ませてから次へ進ませる
    showExplanation(q);

    // 解説を読んだうえで、自分で要復習にするか決められるようにする
    document.getElementById('mark-check').checked = isMarked(q.id);
    document.getElementById('mark-row').classList.remove('hidden');

    const nextBtn = document.getElementById('next-btn');
    nextBtn.textContent = enemyHp <= 0 ? '戦果を確認する' : '次の問題へ';
    nextBtn.classList.remove('hidden');

    updateStats();
    saveReviewState();
    updateReviewBtn();
  });

  document.getElementById('mark-check').addEventListener('change', (e) => {
    const q = currentSessionQuestions[currentQuestionIndex];
    if (e.target.checked) {
      if (!isMarked(q.id)) markedQuestions.push(q);
    } else {
      markedQuestions = markedQuestions.filter(x => x.id !== q.id);
    }
    saveReviewState();
    updateReviewBtn();
  });

  function showExplanation(q) {
    const box = document.getElementById('explanation');
    box.textContent = '';

    const title = document.createElement('span');
    title.className = 'explanation-title';
    title.textContent = '📜 解 説';
    box.appendChild(title);
    box.appendChild(document.createTextNode(q.explanation || 'この問題の解説はまだ用意されていません。'));

    box.classList.remove('hidden');
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // 敵を討ち取っていれば戦果報告へ、そうでなければ次の問題へ
  function proceed() {
    if (enemyHp <= 0) {
      finishQuiz();
    } else {
      nextQuestion();
    }
  }

  function nextQuestion() {
    if (currentQuestionIndex + 1 < currentSessionQuestions.length) {
      currentQuestionIndex++;
      showQuestion();
    } else {
      finishQuiz();
    }
  }

  function formatElapsedTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return mins > 0 ? `${mins}分${secs}秒` : `${secs}秒`;
  }

  function finishQuiz() {
    const totalQ = answeredCount;
    const accuracyRate = totalQ === 0 ? 0 : Math.round((correctCount / totalQ) * 100);
    const isDefeated = enemyHp <= 0;

    const elapsedSeconds = Math.round((Date.now() - sessionStartTime) / 1000);
    const timeFormatted = formatElapsedTime(elapsedSeconds);

    const titleMsg = isDefeated ? "🎉 敵将討ち取ったりーッ！完全勝利！" : "💪 合戦終了！次回こそ討ち取らん！";

    // 絵巻のレベルが上がっていれば、戦果報告で知らせる
    const newLevel = rewardLevel(correctTotal);
    let rewardMsg = '';
    if (newLevel > sessionStartLevel) {
      rewardMsg = newLevel >= REWARD_MAX_LEVEL
        ? `\n\n🏆 絵巻が完全に開かれた！（Lv.${REWARD_MAX_LEVEL}）`
        : `\n\n🏆 絵巻の解像度が上がった！ Lv.${sessionStartLevel} → Lv.${newLevel}`;
    }

    const summaryText =
      `${titleMsg}\n\n` +
      `-------------------------\n` +
      `【戦果報告】\n` +
      `・所要時間: ${timeFormatted}\n` +
      `・討伐数: ${correctCount} / ${totalQ} 問\n` +
      `・正答率: ${accuracyRate}%\n` +
      `・最大連撃: ${maxComboCount} 連撃🔥\n` +
      `-------------------------` +
      rewardMsg;

    alert(summaryText);
    goSetup();
  }

  document.getElementById('next-btn').addEventListener('click', proceed);
  document.getElementById('back-setup-btn').addEventListener('click', goSetup);

  // 解答後は、次へボタンを押さなくてもエンターキーで次の問題へ進める
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.repeat || e.isComposing) return;
    if (document.getElementById('quiz-screen').classList.contains('hidden')) return;
    if (document.getElementById('next-btn').classList.contains('hidden')) return;

    e.preventDefault();
    proceed();
  });

  function hideBattleLayers() {
    document.getElementById('enemy-stage').classList.add('hidden');
    document.getElementById('full-fx-layer').classList.add('hidden');
    document.getElementById('fixed-battle-ui').classList.add('hidden');
    document.getElementById('vertical-battle-ui').classList.add('hidden');
  }

  function goSetup() {
    hideBattleLayers();
    document.body.classList.remove('quiz-layout');
    document.getElementById('review-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('setup-screen').classList.remove('hidden');
    updateReviewBtn();
    updateRewardPanel();
  }

  function goHome() {
    hideBattleLayers();
    document.body.classList.remove('quiz-layout');
    document.body.classList.add('home-layout');
    document.getElementById('review-screen').classList.add('hidden');
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('home-screen').classList.remove('hidden');
  }
</script>
</body>
</html>
