<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一問一答ポータル - 戦国合戦Ver.</title>
  <style>
    :root {
      --primary: #8b0000; /* 漆黒・深紅 */
      --success: #28a745;
      --danger: #dc3545;
      --bg: #120c0a;
      --card-bg: rgba(25, 20, 20, 0.88);
    }

    body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", -apple-system, BlinkMacSystemFont, serif;
      background-color: var(--bg);
      /* ⚔️ 戦国荒野風の背景（赤黒い雲・荒涼とした大地イメージ） */
      background:
        radial-gradient(circle at 50% 30%, rgba(139, 0, 0, 0.3) 0%, transparent 70%),
        linear-gradient(to bottom, #1a0f0d 0%, #0d0806 60%, #050302 100%);
      color: #eaeaea;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* 🎯 全体を下寄りに配置 */
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
      position: relative;
    }

    /* 教科選択画面は敵の立ち絵がないため、カードを画面中央に置く */
    body.home-layout {
      justify-content: center;
    }

    body.home-layout .app-container {
      margin-bottom: 0;
    }

    /* 戦国の荒野：火の粉や霞の演出用オーバーレイ */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 50% 100%, rgba(255, 68, 0, 0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 2;
    }

    /* 🎯 アプリメイン容器（画面中央～下部に配置） */
    .app-container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border: 1px solid #5a3825;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(139, 0, 0, 0.3);
      position: relative;
      z-index: 10;
      backdrop-filter: blur(10px);
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    h1, h2 {
      text-align: center;
      margin-top: 0;
      color: #f3a852;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.2rem; }

    button, input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #664433;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
      background: #2a1f1b;
      color: #fff;
    }

    button {
      background: linear-gradient(180deg, #8b1a1a 0%, #5c0e0e 100%);
      color: #ffe6d0;
      border: 1px solid #a33232;
      font-weight: bold;
      cursor: pointer;
      text-shadow: 0 1px 2px #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    button:active { opacity: 0.9; transform: translateY(1px); }
    button:disabled {
      background: #443833 !important;
      border-color: #554842 !important;
      color: #887770 !important;
      cursor: not-allowed;
    }

    /* 教科選択グリッド */
    .subject-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .subject-btn {
      padding: 20px 10px;
      font-size: 1.1rem;
      background: linear-gradient(180deg, #3a2a24 0%, #241915 100%);
      color: #f0e0d0;
      border: 1px solid #775544;
      margin-bottom: 0;
    }

    /* 分野・カテゴリチェックボックス */
    .category-group {
      background: rgba(0, 0, 0, 0.4);
      padding: 15px;
      border: 1px solid #443028;
      border-radius: 8px;
      margin-bottom: 15px;
      max-height: 200px;
      overflow-y: auto;
    }

    .category-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      font-size: 1rem;
      cursor: pointer;
      color: #ddd;
    }

    .category-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 10px;
      cursor: pointer;
    }

    .select-tools {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .select-tools button {
      padding: 6px 12px;
      font-size: 0.85rem;
      background: #4a3b35;
      border-color: #665248;
      margin-bottom: 0;
    }

    .stats {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #44332a;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-around;
      text-align: center;
      color: #cca;
    }

    /* -----------------------------------
       👹 画面上部中央：敵キャラ立ち絵エリア
    ----------------------------------- */
    .enemy-stage {
      position: fixed;
      top: 50px; /* HPゲージの直下に配置 */
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }

    /* 小さめに配置された敵立ち絵 */
    .enemy-sprite {
      max-width: 180px;  /* 🎯 小さめのサイズ感 */
      max-height: 180px;
      object-fit: contain;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.9)) drop-shadow(0 0 10px rgba(255, 0, 0, 0.3));
      transition: transform 0.2s, filter 0.3s;
      /* 待機中は上下させ、生きているように見せる（数値を小さくするほど速くなる） */
      animation: enemy-idle 2.2s ease-in-out infinite;
      transform-origin: center bottom;
    }

    /* 呼吸するような上下動。浮くほど影が離れて柔らかくなる */
    @keyframes enemy-idle {
      0%, 100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 10px 15px rgba(0,0,0,0.9)) drop-shadow(0 0 10px rgba(255, 0, 0, 0.3));
      }
      50% {
        transform: translateY(-7px) scale(1.015);
        filter: drop-shadow(0 18px 20px rgba(0,0,0,0.7)) drop-shadow(0 0 20px rgba(255, 0, 0, 0.5));
      }
    }

    /* 動きが苦手な人のために、設定でオフにできるようにする */
    @media (prefers-reduced-motion: reduce) {
      .enemy-sprite { animation: none; }
    }

    /* ダメージ時の立ち絵演出 */
    .enemy-sprite.shake {
      animation: enemy-hit 0.4s ease-in-out;
    }

    @keyframes enemy-hit {
      0% { transform: scale(1); filter: brightness(1); }
      20% { transform: scale(1.15) rotate(-5deg); filter: brightness(3) drop-shadow(0 0 30px #ff0055); }
      40% { transform: scale(0.9) rotate(5deg); filter: brightness(2) drop-shadow(0 0 20px #00ffff); }
      60% { transform: scale(1.05); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .enemy-sprite.defeated {
      animation: enemy-defeated 1.2s forwards;
    }

    @keyframes enemy-defeated {
      0% { transform: scale(1); opacity: 1; filter: brightness(5) drop-shadow(0 0 50px white); }
      50% { transform: scale(1.2) translateY(-20px); opacity: 0.8; filter: brightness(10) drop-shadow(0 0 80px red); }
      100% { transform: scale(0) translateY(50px); opacity: 0; }
    }

    /* -----------------------------------
       🩸 画面上部固定 UI（HPバー）
    ----------------------------------- */
    .fixed-battle-ui {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 500px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .hp-container {
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #8b0000;
      border-radius: 10px;
      height: 22px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(139, 0, 0, 0.8);
    }

    .hp-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(to right, #e63946, #ff758c);
      transition: width 0.4s ease-out;
    }

    .combo-badge {
      margin-top: 4px;
      background: linear-gradient(45deg, #ff0055, #ffaa00);
      color: #fff;
      font-weight: 900;
      font-size: 0.95rem;
      padding: 2px 12px;
      border-radius: 12px;
      box-shadow: 0 0 12px #ff0055;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.3s;
    }

    .combo-badge.show {
      opacity: 1;
      transform: scale(1);
    }

    /* 💥 全画面エフェクト層 */
    .full-fx-layer {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 15;
      overflow: hidden;
    }

    /* 衝撃波・斬撃（敵の立ち絵の位置：top: 140px 周辺に発生） */
    .impact-effect {
      position: absolute;
      top: 140px;
      left: 50%;
      width: 10px; height: 10px;
      background: radial-gradient(circle, #ffffff 10%, #ff4500 40%, rgba(255,0,0,0) 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }

    .impact-effect.active { animation: impact-ring 0.45s ease-out; }

    @keyframes impact-ring {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(60); opacity: 0; }
    }

    .slash-effect {
      position: absolute;
      top: 140px;
      left: 50%;
      width: 0; height: 12px;
      background: #ffffff;
      box-shadow: 0 0 30px #ff3300, 0 0 60px #ffaa00;
      transform: translate(-50%, -50%) rotate(-35deg);
      opacity: 0;
      border-radius: 6px;
    }

    .slash-effect.active { animation: slash-anim 0.35s cubic-bezier(0.1, 0.8, 0.3, 1); }

    @keyframes slash-anim {
      0% { width: 0; opacity: 1; transform: translate(-50%, -50%) rotate(-35deg) scaleY(1); }
      50% { width: 120vw; opacity: 1; transform: translate(-50%, -50%) rotate(-35deg) scaleY(3); }
      100% { width: 140vw; opacity: 0; transform: translate(-50%, -50%) rotate(-35deg) scaleY(0.1); }
    }

    /* ダメージ数値 */
    .damage-num {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      /* 画面幅に収まるよう文字を伸縮させ、長いラベルは折り返す */
      width: 92vw;
      max-width: 480px;
      text-align: center;
      font-size: clamp(1.6rem, 6.5vw, 3rem);
      line-height: 1.2;
      font-weight: 900;
      color: #ffea00;
      text-shadow: 0 0 15px #ffea00, 3px 3px 0 #000;
      opacity: 0;
      font-style: italic;
    }

    .damage-num.active { animation: pop-damage 0.85s ease-out; }

    @keyframes pop-damage {
      0% { transform: translate(-50%, 20px) scale(0.3); opacity: 1; }
      40% { transform: translate(-50%, -15px) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -40px) scale(1); opacity: 0; }
    }

    /* ----------------------------------- */

    .question-card {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #553a2e;
      padding: 15px;
      border-radius: 8px;
      min-height: 65px;
      font-size: 1.05rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      line-height: 1.5;
    }

    .feedback {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
      display: none;
      position: relative;
      overflow: hidden;
    }

    .feedback.correct {
      background-color: rgba(40, 167, 69, 0.2);
      border: 1px solid var(--success);
      color: #72e08a;
      display: block;
    }

    .feedback.incorrect {
      background-color: rgba(220, 53, 69, 0.2);
      border: 1px solid var(--danger);
      color: #ff8e98;
      display: block;
    }

    /* 📜 解説（正解・不正解にかかわらず必ず表示する） */
    .explanation {
      margin-top: 12px;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(62, 46, 31, 0.55) 0%, rgba(28, 21, 16, 0.6) 100%);
      border: 1px solid #6b5236;
      border-left: 4px solid #f3a852;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.85;
      color: #f2e8da;
      text-align: left;
      max-height: 45vh;
      overflow-y: auto;
    }

    .explanation-title {
      display: block;
      color: #f3a852;
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      margin-bottom: 6px;
    }

    /* 🏆 ご褒美：正解を重ねるほど解像度が上がる絵巻 */
    .reward-panel {
      margin-top: 18px;
      padding: 14px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid #6b5236;
      border-radius: 10px;
      text-align: center;
    }

    .reward-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.85rem;
      color: #f3a852;
      margin-bottom: 10px;
    }

    .reward-level {
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    .reward-frame {
      display: inline-block;
      padding: 6px;
      background: linear-gradient(145deg, #6b5236, #2a1f18);
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7);
      cursor: pointer;
      line-height: 0;
    }

    .reward-canvas {
      width: 190px;
      height: 285px;
      display: block;
      background: #100b09;
      border-radius: 3px;
    }

    .reward-bar {
      margin: 12px 0 6px;
      height: 8px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #55402c;
      border-radius: 5px;
      overflow: hidden;
    }

    .reward-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #b9832f, #ffd479);
      transition: width 0.6s ease-out;
    }

    .reward-caption {
      font-size: 0.82rem;
      color: #ccb89a;
      line-height: 1.6;
    }

    /* 拡大表示のオーバーレイ */
    .reward-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(5, 3, 2, 0.94);
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 20px;
      box-sizing: border-box;
      cursor: pointer;
    }

    .reward-overlay canvas {
      max-width: 100%;
      max-height: 78vh;
      border-radius: 6px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
    }

    .reward-overlay p {
      margin: 0;
      color: #ccb89a;
      font-size: 0.85rem;
      text-align: center;
    }

    /* ✅ 解答後に出す「要復習」のチェック */
    .mark-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(80, 60, 30, 0.35);
      border: 1px solid #6b5236;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      color: #f0e0c8;
      user-select: none;
    }

    .mark-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 📋 復習リスト */
    .review-summary {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #44332a;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: #ccb89a;
      text-align: center;
      line-height: 1.7;
    }

    .review-list {
      max-height: 46vh;
      overflow-y: auto;
      margin-bottom: 14px;
      border: 1px solid #443028;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px;
    }

    .review-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid #38281f;
    }

    .review-item:last-child { border-bottom: none; }

    .review-badges {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .review-badge {
      display: inline-block;
      width: 26px;
      height: 26px;
      line-height: 26px;
      text-align: center;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    /* 違＝間違えた問題、復＝自分で印をつけた問題 */
    .badge-wrong { background: rgba(220, 53, 69, 0.35); border: 1px solid var(--danger); color: #ff9ba3; }
    .badge-marked { background: rgba(243, 168, 82, 0.25); border: 1px solid #f3a852; color: #ffcf90; }

    .review-body { flex: 1; min-width: 0; }

    .review-q {
      font-size: 0.92rem;
      line-height: 1.6;
      color: #eee;
      margin-bottom: 4px;
    }

    .review-a { font-size: 0.86rem; color: #8fd9a0; }
    .review-cat { font-size: 0.78rem; color: #9a8a76; }

    .review-remove {
      width: auto;
      flex-shrink: 0;
      padding: 5px 10px;
      font-size: 0.78rem;
      background: #4a3b35;
      border-color: #665248;
      margin-bottom: 0;
      align-self: center;
    }

    .review-empty {
      padding: 30px 10px;
      text-align: center;
      color: #9a8a76;
      font-size: 0.9rem;
      line-height: 1.8;
    }

    /* 🩸 縦のHPバー（パソコン表示でのみ使う） */
    .vertical-battle-ui {
      position: fixed;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 20;
      pointer-events: none;
    }

    .vhp-container {
      flex: 1;
      width: 28px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #8b0000;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(139, 0, 0, 0.8);
      position: relative;
    }

    /* 上端で固定してあるので、高さが減ると下から削れて敵の方へ迫っていく */
    .vhp-fill {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 100%;
      background: linear-gradient(to bottom, #ff758c, #e63946);
      transition: height 0.45s ease-out;
    }

    .vhp-value {
      text-align: center;
      line-height: 1.2;
    }

    .vhp-value span {
      display: block;
      font-size: 1.5rem;
      font-weight: bold;
      color: #ff9ba3;
      text-shadow: 0 0 10px rgba(230, 57, 70, 0.9), 0 2px 3px #000;
    }

    .vhp-value small {
      font-size: 0.7rem;
      color: #b09088;
      letter-spacing: 0.1em;
    }

    /* 出題数の選択 */
    .count-tools {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .count-tools button {
      padding: 10px 4px;
      font-size: 0.95rem;
      background: #3a2a24;
      border-color: #775544;
      margin-bottom: 0;
      line-height: 1.3;
    }

    .count-tools button small {
      display: block;
      font-size: 0.68rem;
      font-weight: normal;
      color: #b09880;
      margin-top: 2px;
    }

    .count-tools button.selected {
      background: linear-gradient(180deg, #8b1a1a 0%, #5c0e0e 100%);
      border-color: #d4a04a;
      box-shadow: 0 0 10px rgba(212, 160, 74, 0.5);
    }

    .count-tools button.selected small { color: #ffd9a0; }

    /* 中断からの再開 */
    .resume-box {
      background: rgba(80, 60, 30, 0.4);
      border: 1px solid #d4a04a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .resume-box > div {
      font-size: 0.9rem;
      color: #ffd9a0;
      margin-bottom: 10px;
      text-align: center;
      line-height: 1.6;
    }

    .resume-discard {
      background: #4a3b35 !important;
      border-color: #665248 !important;
      font-size: 0.82rem;
      padding: 7px;
      margin-bottom: 0;
    }

    /* 惜しい（1〜2文字違い）の判定 */
    .feedback.close {
      background-color: rgba(243, 168, 82, 0.18);
      border: 1px solid #f3a852;
      color: #ffd08a;
      display: block;
    }

    .feedback .yours {
      display: block;
      margin-top: 4px;
      font-size: 0.85rem;
      font-weight: normal;
      color: #c9b193;
    }

    /* 🏅 戦果カード */
    .result-canvas {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 0 auto 16px;
      border-radius: 10px;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.8), 0 0 14px rgba(212, 160, 74, 0.3);
    }

    @media (min-width: 900px) {
      .result-canvas { max-width: 360px; }
    }

    /* 📅 続けた記録 */
    .study-panel {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid #5a4530;
      border-radius: 10px;
      padding: 14px;

    /* 🗣 味方と観客の帯 */
    .stage-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
      margin-bottom: 12px;

    .ally-canvas {

      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 味方のひとこと */
    .ally-bubble {
      position: relative;
      background: linear-gradient(180deg, rgba(70, 52, 34, 0.85), rgba(44, 32, 22, 0.85));
      border: 1px solid #7a5f3c;
      border-radius: 10px;

      color: #ffeccd;

      min-height: 38px;

    .ally-bubble::before {
      content: "";
      position: absolute;
      left: -7px;
      top: 16px;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 7px solid #7a5f3c;
    }

    .ally-bubble.pop { animation: bubble-pop 0.35s ease-out; }

    @keyframes bubble-pop {

      60%  { transform: scale(1.02); opacity: 1; }

  // ----- 📅 学習の記録（日付・連続日数） -----

  const GRACE_PER_WEEK = 2;   // 週にこの回数までは休んでも連続が途切れない

  const dateKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const loadStudyLog = () => JSON.parse(localStorage.getItem('studyLog') || '{}');

  function recordAnswer(ok, seconds) {
    const log = loadStudyLog();
    const key = dateKey(new Date());
    const day = log[key] || { answered: 0, correct: 0, seconds: 0, subjects: [] };
    day.answered++;
    if (ok) day.correct++;
    day.seconds += Math.round(seconds);
    if (!day.subjects.includes(currentSubjectKey)) day.subjects.push(currentSubjectKey);
    log[key] = day;
    localStorage.setItem('studyLog', JSON.stringify(log));
  }

  // 連続日数。休んだ日があっても、直近7日のうち2日までなら途切れない。
  // 1日休んだだけでゼロに戻る設計は、その時点で開かれなくなるため
  function computeStreak(log) {
    const d = new Date();
    if (!log[dateKey(d)]) d.setDate(d.getDate() - 1);  // 今日はこれからなので数えない

    let streak = 0;
    const missed = [];
    for (let i = 0; i < 400; i++) {
      if (log[dateKey(d)]) {
        streak++;
      } else {
        missed.push(i);
        // 直近7日ぶんの中に休みが3日あったら、そこで連続は終わり
        if (missed.filter(x => x > i - 7).length > GRACE_PER_WEEK) break;
      }
      d.setDate(d.getDate() - 1);
    }
    // 守りの残数は「直近7日のうち、今日を除いて休んだ日数」から数える。
    // 数え方を単純にしておかないと、残り何回休めるのかを本人が予測できない
    let recentMiss = 0;
    for (let i = 1; i < 7; i++) {
      const back = new Date();
      back.setDate(back.getDate() - i);
      if (!log[dateKey(back)]) recentMiss++;
    }
    return { streak, graceLeft: Math.max(0, GRACE_PER_WEEK - recentMiss) };
  }

  function updateStudyPanel() {
    const log = loadStudyLog();
    const today = log[dateKey(new Date())] || { answered: 0 };
    const { streak, graceLeft } = computeStreak(log);
    const total = Object.values(log).reduce((a, d) => a + d.answered, 0);

    document.getElementById('streak-num').textContent = streak;
    document.getElementById('today-num').textContent = today.answered;
    document.getElementById('total-num').textContent = total;

    // 直近14日の棒グラフ
    const bars = document.getElementById('streak-bars');
    bars.textContent = '';
    const counts = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      counts.push((log[dateKey(d)] || {}).answered || 0);
    }
    const max = Math.max(10, ...counts);
    counts.forEach((n, i) => {
      const bar = document.createElement('i');
      if (n === 0) bar.className = 'none';
      else {
        bar.style.height = `${Math.max(12, Math.round(n / max * 100))}%`;
        if (i === 13) bar.className = 'today';
      }
      bars.appendChild(bar);
    });

    const note = document.getElementById('streak-note');
    if (today.answered > 0) {
      note.textContent = `今日はもう解きました　守り 残り${graceLeft}`;
    } else if (streak > 0) {
      note.textContent = `連続${streak}日を守るには、今日1問でも解けば大丈夫　守り 残り${graceLeft}`;
    } else {
      note.textContent = '1問でも解けば、今日から連続が始まります';
    }
  }

  const SLASH_FILE = 'sounds/slash.mp3';

  let audioCtx = null;
  let slashBuffer = null;      // 読みこみ済みの音声データ
  let slashFailed = false;     // 読みこみに失敗したか
  let soundEnabled = localStorage.getItem('soundEnabled') !== 'off';

  function getAudioContext() {
    if (audioCtx) return audioCtx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
    return audioCtx;
  }

  // 音声ファイルは一度だけ読みこんで展開しておく。
  // 毎回ファイルを読むと、正解した瞬間に音が遅れて出てしまう
  function loadSlashSound() {
    const ctx = getAudioContext();
    if (!ctx || slashBuffer || slashFailed) return;

    fetch(SLASH_FILE)
      .then(res => {
        if (!res.ok) throw new Error(res.status);
        return res.arrayBuffer();
      })
      .then(data => ctx.decodeAudioData(data))
      .then(decoded => {
        slashBuffer = decoded;
        updateSoundBtn();
      })
      .catch(() => {
        slashFailed = true;
        updateSoundBtn();
      });
  }

  // power: ダメージ倍率。会心や連撃ほど、わずかに速く鋭い音になる
  function playSlashSound(power) {
    if (!soundEnabled || !slashBuffer) return;

    const ctx = getAudioContext();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();

    const source = ctx.createBufferSource();
    source.buffer = slashBuffer;
    source.playbackRate.value = 0.94 + Math.min(power, 1.5) * 0.08;

    // 元ファイルの最大振幅が0.6のため、他の演出と音量がそろうよう持ち上げる
    const gain = ctx.createGain();
    gain.gain.value = 1.45;

    // 毎回新しく作るので、連続で正解しても音が途切れず重なって鳴る
    source.connect(gain).connect(ctx.destination);
    source.start();
  }

    if (slashFailed) {

    }

  }

  function rewardLevel(total) {
    let level = 0;
    REWARD_STEPS.forEach((step, i) => {
      if (total >= step.need) level = i;
    });
    return level;
  }

  function drawReward(canvas, level) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;

    ctx.clearRect(0, 0, w, h);
    if (!rewardImage) {
      ctx.fillStyle = '#2a1f18';
      ctx.fillRect(0, 0, w, h);
      return;
    }

    // 味方として画面に出すため、モザイクではなく「影が晴れていく」形にする。
    // モザイクだと何が描いてあるか分からず、相棒として成立しないため
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(rewardImage, 0, 0, w, h);

    const veil = REWARD_STEPS[level].veil;
    if (veil > 0) {
      ctx.globalCompositeOperation = 'source-atop';   // 絵の形の中だけを暗くする
      ctx.fillStyle = `rgba(8, 4, 2, ${veil})`;
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function updateRewardPanel() {

    document.getElementById('reward-title').textContent = REWARD_TITLES[currentSubjectKey] || '絵巻';

    } else {
      const from = REWARD_STEPS[level].need;
      const to = REWARD_STEPS[level + 1].need;
      fill.style.width = `${Math.round((correctTotal - from) / (to - from) * 100)}%`;
      caption.textContent =
        `累計${correctTotal}問正解 ／ あと${to - correctTotal}問でLv.${level + 1}、影がさらに晴れる`;

  }

  const isWrong = id => wrongQuestions.some(q => q.id === id);

  function saveReviewState() {

  // 両方を1つにまとめる。どちらにも入っている問題は1件として扱う
  function buildReviewList() {
    const cats = getSelectedCategories();
    const merged = new Map();
    wrongQuestions.concat(markedQuestions).forEach(q => {
      if (cats.includes(q.category)) merged.set(q.id, q);
    });
    return [...merged.values()];

  function clearSession() {
    localStorage.removeItem(`session_${currentSubjectKey}`);
  }

  function updateResumeBox() {
    const box = document.getElementById('resume-box');
    const raw = localStorage.getItem(`session_${currentSubjectKey}`);
    if (!raw) { box.classList.add('hidden'); return; }
    try {
      const st = JSON.parse(raw);
      document.getElementById('resume-text').textContent =
        `前回の${st.mode}が途中です　${st.index}/${st.ids.length}問　敵HP ${Math.ceil(Math.max(0, st.enemyHp))}`;
      box.classList.remove('hidden');
    } catch (err) {
      clearSession();
      box.classList.add('hidden');
    }
  }

  // 合戦のはじめに、味方と軍勢が声をかける
  function openingReaction() {
    drawAlly();
    sayAlly('start');
    document.getElementById('comment-strip').textContent = '';
    const log = loadStudyLog();
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const cameBack = Object.keys(log).length > 0 && !log[dateKey(yesterday)];
    addComment(cameBack ? 'comeback' : 'start', 2);
  }

  function enterBattle() {
    updateHpBar();
    updateComboBadge();
    document.body.classList.add('quiz-layout');
    document.getElementById('enemy-stage').classList.remove('hidden');
    document.getElementById('full-fx-layer').classList.remove('hidden');
    document.getElementById('fixed-battle-ui').classList.remove('hidden');
    document.getElementById('vertical-battle-ui').classList.remove('hidden');
    document.getElementById('review-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    showQuestion();
  }

  document.getElementById('resume-btn').addEventListener('click', () => {
    const st = JSON.parse(localStorage.getItem(`session_${currentSubjectKey}`));
    const byId = new Map(allQuestions.map(x => [x.id, x]));
    currentSessionQuestions = st.ids.map(id => byId.get(id)).filter(Boolean);
    if (!currentSessionQuestions.length) { clearSession(); updateResumeBox(); return; }

    currentQuestionIndex = Math.min(st.index, currentSessionQuestions.length - 1);
    correctCount = st.correctCount;
    answeredCount = st.answeredCount;
    enemyHp = st.enemyHp;
    comboCount = st.comboCount;
    maxComboCount = st.maxComboCount;
    sessionLog = st.sessionLog || [];
    baseDamagePerQuestion = st.base;
    sessionStartLevel = rewardLevel(correctTotal);
    sessionStartTime = Date.now();
    document.getElementById('current-mode').textContent = st.mode;
    enterBattle();
    openingReaction();
  });

  document.getElementById('resume-discard-btn').addEventListener('click', () => {
    clearSession();
    updateResumeBox();
  });

  document.getElementById('start-btn').addEventListener('click', () => startQuiz(null));

  // questions に配列を渡すと復習戦、null なら通常戦
  function startQuiz(questions) {
    const selectedCats = getSelectedCategories();

    lastWasReview = Boolean(questions);
    if (questions) {
      currentSessionQuestions = questions.slice();
      document.getElementById('current-mode').textContent = "復習戦";
    } else {
      currentSessionQuestions = allQuestions.filter(q => selectedCats.includes(q.category));
      document.getElementById('current-mode').textContent = "通常戦";
    }

    currentSessionQuestions.sort(() => Math.random() - 0.5);

    // 通常戦は選んだ問題数で切る（復習戦は一覧の件数をそのまま使う）
    if (!questions && questionLimit > 0) {
      currentSessionQuestions = currentSessionQuestions.slice(0, questionLimit);
    }

    currentQuestionIndex = 0;
    correctCount = 0;
    answeredCount = 0;
    sessionLog = [];
    comboCount = 0;
    maxComboCount = 0;
    enemyHp = 100;
    sessionStartLevel = rewardLevel(correctTotal);

    sessionStartTime = Date.now();

    const totalQ = currentSessionQuestions.length;
    baseDamagePerQuestion = totalQ > 0 ? (100 / (totalQ * DEFEAT_ACCURACY)) : 100;

    enterBattle();
    openingReaction();
  }

  function showQuestion() {
    const enemySprite = document.getElementById('enemy-sprite');
    enemySprite.className = 'enemy-sprite';

    const q = currentSessionQuestions[currentQuestionIndex];
    document.getElementById('question-text').textContent = `【${q.category}】 ${q.question}`;
    const input = document.getElementById('answer-input');
    input.value = '';
    input.disabled = false;
    input.focus();  // 続けてキーボードだけで解答できるようにする
    document.getElementById('submit-btn').classList.remove('hidden');
    document.getElementById('next-btn').classList.add('hidden');

    const feedback = document.getElementById('feedback');
    feedback.className = 'feedback';
    feedback.textContent = '';
    document.getElementById('explanation').classList.add('hidden');
    document.getElementById('mark-row').classList.add('hidden');

    updateStats();
    saveSession();
    questionStartTime = Date.now();
  }

  function updateStats() {
    const accuracy = answeredCount === 0 ? 0 : Math.round((correctCount / answeredCount) * 100);
    document.getElementById('accuracy').textContent = `${accuracy}%`;
    document.getElementById('progress').textContent = `${currentQuestionIndex + 1}/${currentSessionQuestions.length}`;
  }

  function updateHpBar() {
    const hp = Math.max(0, enemyHp);
    document.getElementById('hp-bar').style.width = `${hp}%`;        // スマホ向けの横バー
    document.getElementById('vhp-fill').style.height = `${hp}%`;     // パソコン向けの縦バー
    document.getElementById('vhp-number').textContent = Math.ceil(hp);
  }

  function updateComboBadge() {
    const badge = document.getElementById('combo-badge');
    if (comboCount >= 2) {
      badge.textContent = `${comboCount} 連撃!🔥`;
      badge.classList.add('show');
    } else {
      badge.classList.remove('show');
    }
  }

  function triggerAttackEffect(timeSec, mode) {
    const enemySprite = document.getElementById('enemy-sprite');
    const impact = document.getElementById('impact');
    const slash = document.getElementById('slash');
    const damage = document.getElementById('damage');

    let multiplier, label;

    if (mode === 'close') {
      // 惜しい解答。半分のダメージは通し、連撃は途切れさせない
      multiplier = 0.5;
      label = '惜しい! ';
    } else {
      comboCount++;
      if (comboCount > maxComboCount) maxComboCount = comboCount;

      // ① 速さによる加点。遅くても1.0倍で、減点はしない
      multiplier = 1.0;
      label = '見事! ';
      if (timeSec <= CRITICAL_SEC) {
        multiplier = 1.3;
        label = '⚡ 会心の一撃! ';
      } else if (timeSec <= QUICK_SEC) {
        multiplier = 1.15;
        label = '鋭い一撃! ';
      }

      // ② 連撃による加点。速さとは別枠にして、会心が連撃に食われないようにする
      let comboBonus = 0;
      if (comboCount >= 10) comboBonus = 0.5;
      else if (comboCount >= 6) comboBonus = 0.3;
      else if (comboCount >= 3) comboBonus = 0.15;
      if (comboBonus > 0) {
        multiplier += comboBonus;
        label = `🔥 ${comboCount}連撃! ` + label;
      }
    }

    updateComboBadge();
    playSlashSound(multiplier);

    const damagePercent = baseDamagePerQuestion * multiplier;
    enemyHp -= damagePercent;
    if (enemyHp < 0) enemyHp = 0;

    updateHpBar();

    const displayDamage = Math.round(damagePercent * 100);
    damage.textContent = `${label}${displayDamage}`;

    enemySprite.classList.remove('shake', 'defeated');
    impact.classList.remove('active');
    slash.classList.remove('active');
    damage.classList.remove('active');

    setTimeout(() => {
      impact.classList.add('active');
      slash.classList.add('active');
      damage.classList.add('active');

      if (enemyHp <= 0) {
        enemySprite.classList.add('defeated');
      } else {
        enemySprite.classList.add('shake');
      }
    }, 10);
  }

  // 被弾アニメが終わったらクラスを外し、待機の上下動を再開させる
  document.getElementById('enemy-sprite').addEventListener('animationend', (e) => {
    if (e.animationName === 'enemy-hit') {
      e.target.classList.remove('shake');
    }
  });

  // ----- ✍️ 解答の判定 -----

  // 全角と半角、カタカナとひらがな、区切り記号の違いで不正解にしない
  function normalize(text) {
    let t = String(text).trim().toLowerCase();
    t = t.replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
    t = t.replace(/[\s\u3000]/g, '');
    t = t.replace(/[・、。，．「」『』]/g, '');
    t = t.replace(/ヶ/g, 'ケ').replace(/ヵ/g, 'カ');
    t = t.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
    return t;
  }

  // 何文字違うか（レーベンシュタイン距離）
  function editDistance(a, b) {
    const dp = Array.from({ length: a.length + 1 }, (_, i) => {
      const row = new Array(b.length + 1).fill(0);
      row[0] = i;
      return row;
    });
    for (let j = 0; j <= b.length; j++) dp[0][j] = j;
    for (let i = 1; i <= a.length; i++) {
      for (let j = 1; j <= b.length; j++) {
        dp[i][j] = Math.min(
          dp[i - 1][j] + 1,
          dp[i][j - 1] + 1,
          dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
        );
      }
    }
    return dp[a.length][b.length];
  }

  // 'correct'（正解） / 'close'（惜しい） / 'wrong'（不正解）
  function judgeAnswer(input, q) {
    const given = normalize(input);
    const answers = [q.answer].concat(q.alt || []).map(normalize);
    if (answers.includes(given)) return 'correct';

    // 短い答えは1文字違うと別の答えになりうるので、惜しい判定を使わない
    const allowed = given.length <= 3 ? 0 : (given.length <= 6 ? 1 : 2);
    if (allowed > 0 && answers.some(a =>
        Math.abs(a.length - given.length) <= allowed && editDistance(given, a) <= allowed)) {
      return 'close';
    }
    return 'wrong';
  }

  // 解答判定
  document.getElementById('answer-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('answer-input').value.trim();
    const q = currentSessionQuestions[currentQuestionIndex];
    const feedback = document.getElementById('feedback');

    const answerTimeSec = (Date.now() - questionStartTime) / 1000;
    answeredCount++;

    document.getElementById('answer-input').disabled = true;
    document.getElementById('submit-btn').classList.add('hidden');

    const verdict = judgeAnswer(input, q);

    if (verdict === 'correct') {
      triggerAttackEffect(answerTimeSec, 'correct');

      correctCount++;
      // 同じ問題を繰り返しても絵巻は進まない（初めて正解した問題だけ数える）
      if (!solvedIds.has(q.id)) {
        solvedIds.add(q.id);
        correctTotal++;
        localStorage.setItem(`correctTotal_${currentSubjectKey}`, String(correctTotal));
        localStorage.setItem(`solvedIds_${currentSubjectKey}`, JSON.stringify([...solvedIds]));
      }

      feedback.className = "feedback correct";
      feedback.textContent = `正解！⭕ (${answerTimeSec.toFixed(1)}秒)`;
      wrongQuestions = wrongQuestions.filter(item => item.id !== q.id);

    } else if (verdict === 'close') {
      // 1〜2文字違い。正解にはしないが、半分のダメージを通し連撃も切らさない
      triggerAttackEffect(answerTimeSec, 'close');

      feedback.className = "feedback close";
      feedback.textContent = `惜しい！正答は「${q.answer}」`;
      const yours = document.createElement('span');
      yours.className = 'yours';
      yours.textContent = `あなたの答え: ${input}`;
      feedback.appendChild(yours);

      if (!wrongQuestions.some(item => item.id === q.id)) wrongQuestions.push(q);

    } else {
      comboCount = 0;
      updateComboBadge();

      feedback.className = "feedback incorrect";
      feedback.textContent = `無念…❌ (正答: ${q.answer})`;
      if (!wrongQuestions.some(item => item.id === q.id)) {
        wrongQuestions.push(q);
      }
    }

    sessionLog.push({ id: q.id, category: q.category, ok: verdict === 'correct' });
    recordAnswer(verdict === 'correct', answerTimeSec);

    // 味方と、後方の軍勢が反応する
    let kind = verdict;
    if (verdict === 'correct') {
      if (comboCount >= 3) kind = 'combo';
      else if (answerTimeSec <= CRITICAL_SEC) kind = 'critical';
    }
    sayAlly(kind);
    addComment(kind, kind === 'combo' ? 3 : (kind === 'critical' ? 2 : 1));

    // 正解・不正解にかかわらず解説を読ませてから次へ進ませる
    showExplanation(q);

    // 解説を読んだうえで、自分で要復習にするか決められるようにする
    document.getElementById('mark-check').checked = isMarked(q.id);
    document.getElementById('mark-row').classList.remove('hidden');

    const nextBtn = document.getElementById('next-btn');
    const isLast = currentQuestionIndex + 1 >= currentSessionQuestions.length;
    nextBtn.textContent = isLast ? '戦果を確認する' : '次の問題へ';
    nextBtn.classList.remove('hidden');

    updateStats();
    saveSession();
    saveReviewState();
    updateReviewBtn();
  });

  document.getElementById('mark-check').addEventListener('change', (e) => {
    const q = currentSessionQuestions[currentQuestionIndex];
    if (e.target.checked) {
      if (!isMarked(q.id)) markedQuestions.push(q);
    } else {
      markedQuestions = markedQuestions.filter(x => x.id !== q.id);
    }
    saveReviewState();
    updateReviewBtn();
  });

  function showExplanation(q) {
    const box = document.getElementById('explanation');
    box.textContent = '';

    const title = document.createElement('span');
    title.className = 'explanation-title';
    title.textContent = '📜 解 説';
    box.appendChild(title);
    box.appendChild(document.createTextNode(q.explanation || 'この問題の解説はまだ用意されていません。'));

    box.classList.remove('hidden');
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // 敵を討ち取っても、選んだ問題数は最後までやり切る
  // （途中で打ち切ると「10問選んだのに8問で終わる」ことになるため）
  function proceed() {
    nextQuestion();
  }

  function nextQuestion() {
    if (currentQuestionIndex + 1 < currentSessionQuestions.length) {
      currentQuestionIndex++;
      showQuestion();
    } else {
      finishQuiz();
    }
  }

  function formatElapsedTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return mins > 0 ? `${mins}分${secs}秒` : `${secs}秒`;
  }

  // ----- 🏅 戦果カード -----

  const SERIF = '"Hiragino Mincho ProN", "Yu Mincho", serif';
  let lastWasReview = false;

  function rankOf(accuracy) {
    if (accuracy >= 100) return { letter: 'S', color: '#e8c06a', glow: 'rgba(232,192,106,0.55)', word: '完全制覇' };
    if (accuracy >= 90)  return { letter: 'A', color: '#d8dde3', glow: 'rgba(216,221,227,0.4)', word: '見事な戦い' };
    if (accuracy >= 70)  return { letter: 'B', color: '#c98a4a', glow: 'rgba(201,138,74,0.4)', word: '善戦' };
    return { letter: 'C', color: '#9a8a7e', glow: 'rgba(154,138,126,0.3)', word: '修練あるのみ' };
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawResultCard(data) {
    const cv = document.getElementById('result-canvas');
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height, mid = W / 2;
    const rank = rankOf(data.accuracy);

    // 背景
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#25120f');
    bg.addColorStop(0.5, '#140b09');
    bg.addColorStop(1, '#0a0504');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 成績に応じた光
    const glow = ctx.createRadialGradient(mid, 620, 60, mid, 620, 700);
    glow.addColorStop(0, rank.glow);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = rank.color;
    ctx.lineWidth = 6;
    roundRect(ctx, 40, 40, W - 80, H - 80, 28);
    ctx.stroke();

    ctx.textAlign = 'center';

    // 見出し
    ctx.fillStyle = rank.color;
    ctx.font = `bold 76px ${SERIF}`;
    ctx.fillText(data.defeated ? '敵将 討ち取ったり' : '合 戦 終 了', mid, 210);

    ctx.fillStyle = '#c9b193';
    ctx.font = `40px ${SERIF}`;
    ctx.fillText(`${data.subject}　${data.mode}`, mid, 290);

    // 正答率
    ctx.fillStyle = '#f5e9d8';
    ctx.font = `bold 300px ${SERIF}`;
    ctx.fillText(`${data.accuracy}`, mid - 40, 640);
    ctx.font = `bold 90px ${SERIF}`;
    ctx.fillText('%', mid + 200, 640);
    ctx.fillStyle = '#9a8a7e';
    ctx.font = `36px ${SERIF}`;
    ctx.fillText('正 答 率', mid, 710);

    // 評価の印
    ctx.beginPath();
    ctx.arc(mid, 880, 92, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fill();
    ctx.strokeStyle = rank.color;
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.fillStyle = rank.color;
    ctx.font = `bold 104px ${SERIF}`;
    ctx.fillText(rank.letter, mid, 918);
    ctx.font = `38px ${SERIF}`;
    ctx.fillText(rank.word, mid, 1030);

    // 3つの数字
    const cells = [
      ['討伐数', `${data.correct} / ${data.total}`],
      ['最大連撃', `${data.maxCombo}`],
      ['所要時間', data.time],
    ];
    cells.forEach(([label, value], i) => {
      const x = 150 + i * 260;
      ctx.fillStyle = '#8a7a70';
      ctx.font = `32px ${SERIF}`;
      ctx.fillText(label, x + 90, 1120);
      ctx.fillStyle = '#f0e0c8';
      ctx.font = `bold 54px ${SERIF}`;
      ctx.fillText(value, x + 90, 1190);
    });

    // 分野別の内訳
    let y = 1300;
    ctx.fillStyle = '#9a8a7e';
    ctx.font = `34px ${SERIF}`;
    ctx.textAlign = 'left';
    ctx.fillText('分野別', 110, y);
    y += 46;

    const shown = data.byCategory.slice(0, 4);
    shown.forEach(row => {
      const pct = row.total ? row.correct / row.total : 0;
      ctx.fillStyle = '#e8ddcc';
      ctx.font = `32px ${SERIF}`;
      ctx.fillText(row.name.length > 10 ? row.name.slice(0, 9) + '…' : row.name, 110, y + 32);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#c9b193';
      ctx.fillText(`${row.correct}/${row.total}`, W - 110, y + 32);
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      roundRect(ctx, 110, y + 48, W - 220, 14, 7);
      ctx.fill();
      ctx.fillStyle = pct >= 0.8 ? '#e8c06a' : (pct >= 0.5 ? '#8fd9a0' : '#e0798a');
      roundRect(ctx, 110, y + 48, Math.max(14, (W - 220) * pct), 14, 7);
      ctx.fill();
      y += 92;
    });

    ctx.textAlign = 'center';
    const rest = data.byCategory.length - shown.length;
    if (rest > 0) {
      ctx.fillStyle = '#6d5f56';
      ctx.font = `28px ${SERIF}`;
      ctx.fillText(`ほか${rest}分野`, mid, y + 10);
    }

    if (data.rewardMsg) {
      ctx.fillStyle = '#e8c06a';
      ctx.font = `34px ${SERIF}`;
      ctx.fillText(data.rewardMsg, mid, 1762);
    }

    ctx.fillStyle = '#6d5f56';
    ctx.font = `30px ${SERIF}`;
    ctx.fillText(data.date, mid, 1818);
    ctx.fillStyle = '#8a7a70';
    ctx.font = `32px ${SERIF}`;
    ctx.fillText('一問一答 学習合戦', mid, 1868);
  }

  function finishQuiz() {
    const total = answeredCount;
    const accuracy = total === 0 ? 0 : Math.round((correctCount / total) * 100);
    const elapsed = Math.round((Date.now() - sessionStartTime) / 1000);

    // 分野ごとに集計する
    const map = new Map();
    sessionLog.forEach(r => {
      const row = map.get(r.category) || { name: r.category, correct: 0, total: 0 };
      row.total++;
      if (r.ok) row.correct++;
      map.set(r.category, row);
    });

    const newLevel = rewardLevel(correctTotal);
    let rewardMsg = '';
    if (newLevel > sessionStartLevel) {
      rewardMsg = newLevel >= REWARD_MAX_LEVEL
        ? '絵巻の影が完全に晴れた'
        : `絵巻の影が晴れてきた  Lv.${sessionStartLevel} → Lv.${newLevel}`;
    }

    const now = new Date();
    drawResultCard({
      subject: currentSubjectName,
      mode: document.getElementById('current-mode').textContent,
      defeated: enemyHp <= 0,
      accuracy, correct: correctCount, total,
      maxCombo: maxComboCount,
      time: formatElapsedTime(elapsed),
      byCategory: [...map.values()].sort((a, b) => b.total - a.total),
      rewardMsg,
      date: `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`,
    });

    clearSession();
    hideBattleLayers();
    document.body.classList.remove('quiz-layout');
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    updateReviewBtn();
    updateRewardPanel();
  }

  document.getElementById('result-save-btn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `戦果_${currentSubjectName}_${new Date().toISOString().slice(0, 10)}.png`;
    link.href = document.getElementById('result-canvas').toDataURL('image/png');
    link.click();
  });

  document.getElementById('result-again-btn').addEventListener('click', () => {
    document.getElementById('result-screen').classList.add('hidden');
    if (lastWasReview) startQuiz(filteredReviewList());
    else startQuiz(null);
  });

  document.getElementById('result-back-btn').addEventListener('click', () => {
    document.getElementById('result-screen').classList.add('hidden');
    goSetup();
  });

  document.getElementById('next-btn').addEventListener('click', proceed);
  document.getElementById('back-setup-btn').addEventListener('click', goSetup);

  // 解答後は、次へボタンを押さなくてもエンターキーで次の問題へ進める
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.repeat || e.isComposing) return;
    if (document.getElementById('quiz-screen').classList.contains('hidden')) return;
    if (document.getElementById('next-btn').classList.contains('hidden')) return;

    e.preventDefault();
    proceed();
  });

  function hideBattleLayers() {
    document.getElementById('enemy-stage').classList.add('hidden');
    document.getElementById('full-fx-layer').classList.add('hidden');
    document.getElementById('fixed-battle-ui').classList.add('hidden');
    document.getElementById('vertical-battle-ui').classList.add('hidden');
  }

  function goSetup() {
    hideBattleLayers();
    document.body.classList.remove('quiz-layout');
    document.getElementById('review-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('setup-screen').classList.remove('hidden');
    updateReviewBtn();
    updateRewardPanel();
    updateResumeBox();
  }

  function goHome() {
    hideBattleLayers();
    document.body.classList.remove('quiz-layout');
    document.body.classList.add('home-layout');
    document.getElementById('review-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('home-screen').classList.remove('hidden');
    updateStudyPanel();
  }
</script>
</body>
</html>
